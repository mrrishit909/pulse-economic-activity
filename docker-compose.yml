# Local stack: `docker compose up --build` (or `make dev`). Ports: web 8461, API 8460, Postgres/PostGIS 55460, mail sink UI 8462.
name: pulse-economic-activity
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment: { POSTGRES_DB: pulse, POSTGRES_USER: pulse, POSTGRES_PASSWORD: owner-dev-only }
    ports: ["127.0.0.1:55460:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"], interval: 2s, retries: 30 }
    volumes: [dbdata:/var/lib/postgresql/data]

  generator:   # synthetic data generator: writes data/fixtures (catalog, conjunction screen, provenance) into a shared volume
    build: { context: ., dockerfile: infra/docker/node.Dockerfile }
    command: ["node", "data/simulators/generate.ts"]
    volumes: [fixtures:/app/data/fixtures]

  api:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile }
    command: ["node", "apps/api/src/main.ts"]
    environment:
      MIGRATE_ON_START: "1"
      PORT: "8460"
      OWNER_DATABASE_URL: postgresql://pulse:owner-dev-only@db:5432/pulse
      DATABASE_URL: postgresql://pulse_app:app-dev-only@db:5432/pulse
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      CORS_ORIGINS: http://localhost:8461,http://127.0.0.1:8461
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    ports: ["127.0.0.1:8460:8460"]
    volumes: [fixtures:/app/data/fixtures]
    depends_on:
      db: { condition: service_healthy }
      generator: { condition: service_completed_successfully }
      otel: { condition: service_started }
      mail: { condition: service_started }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8460/healthz"], interval: 3s, retries: 40, start_period: 10s }

  web:         # the same static site as the public sandbox, built to talk to the API instead of bundled fixtures
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8460" } }
    ports: ["127.0.0.1:8461:80"]
    depends_on: { api: { condition: service_healthy } }

  mail:        # local notification sink: alert e-mails land here (UI on 8462)
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8462:8025"]

  otel:        # OpenTelemetry collector: receives API traces over OTLP/HTTP and prints them (debug exporter)
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel.yaml"]
    volumes: [./infra/otel/collector.yaml:/etc/otel.yaml:ro]

  test:        # `docker compose run --rm test`: unit + API contract tests against a throwaway database
    profiles: [test]
    build: { context: ., dockerfile: infra/docker/node.Dockerfile }
    command: ["sh", "-c", "node data/simulators/generate.ts && npx vitest run"]
    environment:
      OWNER_DATABASE_URL: postgresql://pulse:owner-dev-only@testdb:5432/pulse
      DATABASE_URL: postgresql://pulse_app:app-dev-only@testdb:5432/pulse
    depends_on: { testdb: { condition: service_healthy } }

  testdb:
    profiles: [test]
    image: postgis/postgis:16-3.4-alpine
    environment: { POSTGRES_DB: pulse, POSTGRES_USER: pulse, POSTGRES_PASSWORD: owner-dev-only }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"], interval: 2s, retries: 30 }

volumes: { dbdata: {}, fixtures: {} }
